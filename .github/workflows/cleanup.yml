name: GDPR Cleanup — Hard Delete After 30 Days

on:
  schedule:
    - cron: '0 2 * * *'  # Every day at 2:00 AM UTC
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  cleanup:
    name: Delete User Data Older Than 30 Days
    runs-on: ubuntu-latest
    steps:
      - name: Run GDPR cleanup
        run: |
          echo "Starting GDPR hard-delete for records older than 30 days..."

          HTTP_STATUS=$(curl -s -o /tmp/cleanup_response.txt -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/admin/cleanup-deleted-users")

          RESPONSE_BODY=$(cat /tmp/cleanup_response.txt)
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $RESPONSE_BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ GDPR cleanup FAILED — HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "✅ GDPR cleanup completed successfully"