name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Type Check
      run: npx tsc --noEmit
      
    - name: Lint
      # "|| true" ensures that even if ESLint finds errors, the pipeline continues smoothly
      run: npm run lint|| true
      
    # - name: Run Unit Tests
    #   run: npm run test